name: Tauri Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @vibe/local-web run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri
        run: cd crates/tauri-app && cargo tauri build --target aarch64-apple-darwin --ci

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/tauri-app/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            crates/tauri-app/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          draft: false
          prerelease: true

  build-macos-x64:
    name: macOS (x64 Intel)
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @vibe/local-web run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri
        run: cd crates/tauri-app && cargo tauri build --target x86_64-apple-darwin --ci

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/tauri-app/target/x86_64-apple-darwin/release/bundle/**/*.dmg
            crates/tauri-app/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          draft: false
          prerelease: true

  build-linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @vibe/local-web run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri
        run: cd crates/tauri-app && cargo tauri build --target x86_64-unknown-linux-gnu --ci

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/tauri-app/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            crates/tauri-app/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
          draft: false
          prerelease: true

  build-linux-arm64:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @vibe/local-web run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri
        run: cd crates/tauri-app && cargo tauri build --target aarch64-unknown-linux-gnu --ci

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/tauri-app/target/aarch64-unknown-linux-gnu/release/bundle/**/*.AppImage
            crates/tauri-app/target/aarch64-unknown-linux-gnu/release/bundle/**/*.deb
          draft: false
          prerelease: true

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @vibe/local-web run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri
        run: cd crates/tauri-app && cargo tauri build --target x86_64-pc-windows-msvc --ci

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/tauri-app/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            crates/tauri-app/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          draft: false
          prerelease: true
