name: Tauri Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter @vibe/local-web run build

      - name: Build Tauri
        run: cd crates/tauri-app && cargo tauri build --target ${{ matrix.target }} --ci

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/tauri-app/target/${{ matrix.target }}/release/bundle/**/*.dmg
            crates/tauri-app/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            crates/tauri-app/target/${{ matrix.target }}/release/bundle/**/*.deb
            crates/tauri-app/target/${{ matrix.target }}/release/bundle/msi/*.msi
          draft: false
          prerelease: true
